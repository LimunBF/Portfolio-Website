<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex,follow"/>
    <meta name="theme-color" content="#fff8ef"/>
    <title>Page Not Found | Limun Portfolio</title>
    <link rel="icon" type="image/png" href="/images/logo_bagus.png"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet"/>
    <style>
      :root{--ink:#1f1b2d;--paper:#fff8ef;--surface:#fffdf9;--pink:#ffb6cf;--yellow:#ffe58a;--aqua:#9ce7dc;--lavender:#c7b6ff}
      *{box-sizing:border-box}
      body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;font-family:Inter,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--paper),#f0eaff)}
      main{width:min(100%,760px);border:3px solid var(--ink);background:var(--surface);box-shadow:10px 10px 0 var(--pink),14px 14px 0 var(--ink);padding:clamp(28px,6vw,64px);position:relative;overflow:hidden}
      .badge{display:inline-flex;padding:7px 10px;border:2px solid var(--ink);background:var(--yellow);box-shadow:3px 3px 0 var(--ink);font-size:11px;font-weight:900;letter-spacing:.12em}
      h1{margin:26px 0 12px;font-size:clamp(56px,15vw,120px);line-height:.82;letter-spacing:-.075em}
      h2{margin:0;font-size:clamp(24px,5vw,38px);line-height:1.05}
      p{max-width:560px;margin:18px 0 28px;color:#5b5367;line-height:1.7}
      a{min-height:48px;display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border:2px solid var(--ink);background:var(--aqua);color:var(--ink);box-shadow:4px 4px 0 var(--ink);font-weight:900;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}
      a:hover,a:focus-visible{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink);outline:3px solid var(--ink);outline-offset:4px}
      .shape{position:absolute;right:-34px;top:-38px;width:130px;height:130px;border:3px solid var(--ink);background:var(--lavender);transform:rotate(13deg)}
      @media(max-width:520px){main{box-shadow:7px 7px 0 var(--pink),10px 10px 0 var(--ink)}.shape{width:92px;height:92px}}
      @media(prefers-reduced-motion:reduce){a{transition:none}}
    </style>
  </head>
  <body>
    <main>
      <span class="shape" aria-hidden="true"></span>
      <span class="badge">404 · LIMUN</span>
      <h1>Oops.</h1>
      <h2>This page wandered off.</h2>
      <p>The link may be outdated or the page may have moved. The portfolio is still right where it should be.</p>
      <a href="/">Back to portfolio ↗</a>
    </main>
  </body>
</html>
